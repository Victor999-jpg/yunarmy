<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><script src="https://telegram.org"></script><style>body{font-family:sans-serif;padding:20px;display:flex;flex-direction:column;gap:15px;background:#f4f4f4}input{padding:15px;border-radius:12px;border:2px solid #0088cc;font-size:18px;outline:none}label{font-weight:bold;font-size:13px;color:#333}</style></head><body><label>РУССКИЙ ➔ ПЕРСИДСКИЙ (напиши и нажми 'Готово')</label><input type="text" id="r" lang="ru" placeholder="Привет..."><label>ПЕРСИДСКИЙ ➔ РУССКИЙ (напиши и нажми 'Готово')</label><input type="text" id="f" lang="fa" style="direction:rtl" placeholder="سلام..."><script>const tg=window.Telegram.WebApp;tg.expand();async function tr(el,s,t){if(!el.value)return;const r=await fetch(`https://translate.googleapis.com{s}&tl=${t}&dt=t&q=${encodeURI(el.value)}`);const j=await r.json();if(j[0][0][0])el.value=j[0][0][0]}document.getElementById('r').onchange=function(){tr(this,'ru','fa')};document.getElementById('f').onchange=function(){tr(this,'fa','ru')};</script></body></html>
